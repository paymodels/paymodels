<h2>常见问题页面的定位确认</h2>
<p class="subtitle">这个页面是独立的 FAQ，还是文档系统的一部分？</p>

<div class="options">
    <div class="option" data-choice="standalone" onclick="toggleSelect(this)">
        <div class="letter">A</div>
        <div class="content">
            <h3>独立 FAQ 页面</h3>
            <p>仅展示常见问题，如安全、支付、到账时间等，点击导航直接跳转到该页面</p>
        </div>
    </div>
    <div class="option" data-choice="docs-hub" onclick="toggleSelect(this)">
        <div class="letter">B</div>
        <div class="content">
            <h3>文档中心（多页面）</h3>
            <p>
                以 FAQ
                为入口，但未来可扩展为使用指南、充值教程、退款政策等多个文档页面，形成完整帮助中心
            </p>
        </div>
    </div>
    <div class="option" data-choice="both" onclick="toggleSelect(this)">
        <div class="letter">C</div>
        <div class="content">
            <h3>先 FAQ，未来扩展</h3>
            <p>现在只做 FAQ 页面，但设计时预留扩展为文档中心的能力</p>
        </div>
    </div>
</div>
